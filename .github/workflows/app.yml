name: app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # needed to attach APK to a Release on tag push

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # 3.24.5 — newer stable ships APIs (withValues, initialValue) but
          # we keep the older toolchain so the build is reproducible.
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Install librsvg for icon rasterization
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Rasterize logo.svg into launcher PNGs
        run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../logo.svg -o assets/icon.png
          # Adaptive-icon foreground: render larger so the % glyph stays visible
          # after the system applies its circular/squircle mask.
          rsvg-convert -w 1024 -h 1024 ../logo.svg -o assets/icon_foreground.png

      - name: Scaffold platform code
        run: flutter create . --project-name codehunt --org com.dazeddingo --platforms=android

      - name: Patch AndroidManifest + MainActivity for share intent
        run: python3 ../scripts/patch_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

      - name: Rename APK with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          APK_NAME="codehunt-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: ${{ steps.rename.outputs.apk_path }}

      - name: Attach APK to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_path }}
