name: app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # needed to attach APK to a Release on tag push

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: newer stable Flutter ships Kotlin Gradle 2.x which hard-fails
          # the receive_sharing_intent build on a JVM target mismatch we can't
          # patch around (the android.compileOptions extension is finalized
          # before any subprojects/allprojects hook can fire). 3.24.5 ships
          # Kotlin 1.x which only warns. Revisit when receive_sharing_intent
          # publishes a JVM-17-clean build.
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Scaffold platform code
        run: flutter create . --project-name codehunt --org com.dazeddingo --platforms=android

      - name: Patch AndroidManifest + gradle config
        run: python3 ../scripts/patch_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          APK_NAME="codehunt-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: ${{ steps.rename.outputs.apk_path }}

      - name: Attach APK to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_path }}
