name: codehunt
description: Find currently-working coupon codes on the go.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # Pinned: 1.8.x compiles Kotlin to JVM 17 which conflicts with the
  # default Java 1.8 compile target on plugin modules. 1.6.x is the last
  # version that builds against the Flutter-default JVM 11.
  receive_sharing_intent: 1.6.8
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
